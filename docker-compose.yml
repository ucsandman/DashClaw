# Provisions local Postgres only: `docker compose up -d db`.
# The app itself runs via `npm run dev` or `npx dashclaw up` (which provisions its
# own embedded Postgres) — this file is not a production deployment path.
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=dashclaw
      - POSTGRES_PASSWORD=dashclaw
      - POSTGRES_DB=dashclaw
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  postgres_data:
