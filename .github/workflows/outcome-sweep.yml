name: Outcome sweep

# Scheduler for `/api/cron/outcome-sweep`. Marks action_records that exceeded
# their outcome timeout window as `lost_confirmation`. Without this, orphan
# `status='running'` rows accumulate and clutter the Mission Control
# operations feed (see drizzle/0005_orphan_action_backfill.sql for the
# one-shot cleanup of pre-existing zombies).
#
# Setup (same secrets as integration-health.yml — already configured if you
# enabled that one):
#   1. In repo Settings → Secrets and variables → Actions, ensure:
#        - DASHCLAW_BASE_URL  (e.g. https://my-dashclaw.vercel.app)
#        - CRON_SECRET        (matches the CRON_SECRET env on Vercel)
#   2. Enable this workflow (disabled for forks by default).
#
# Manual trigger: Actions tab → "Outcome sweep" → "Run workflow".

on:
  schedule:
    # Every 15 minutes. The cron endpoint's default timeout window is 15 min,
    # so this cadence catches orphans within one window of their cutoff.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/outcome-sweep
        env:
          BASE_URL: ${{ secrets.DASHCLAW_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Outcome sweep: required secrets not configured — run skipped."
            exit 0
          fi
          status=$(curl -sS --max-time 30 --connect-timeout 10 -o /tmp/resp.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/outcome-sweep")
          echo "HTTP $status"
          cat /tmp/resp.json
          if [ "$status" != "200" ]; then
            exit 1
          fi
