name: up-smoke
on:
  pull_request:
    paths: ['cli/**', 'scripts/setup.mjs', 'scripts/lib/**', '.github/workflows/up-smoke.yml']
  push:
    # No paths filter here: GitHub compares a tag push against its already-pushed commit, so a
    # paths filter would see zero changed files and silently skip most tag runs. Run on every
    # main push and every v* tag instead of trying to filter both cleanly in one block.
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  up:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install CLI deps
        run: npm ci --no-audit --no-fund
        working-directory: cli

      - name: Run up (embedded DB, non-interactive, no browser)
        run: node cli/bin/dashclaw.js up --yes --db embedded --no-browser --source-dir . > up.log 2>&1 &
        shell: bash

      - name: Wait for health
        run: |
          for i in $(seq 1 240); do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then exit 0; fi
            sleep 5
          done
          echo "server never became healthy"; exit 1
        shell: bash

      - name: Record one governed action with the minted key
        run: |
          KEY=$(node -e "console.log(JSON.parse(require('fs').readFileSync(require('os').homedir()+'/.dashclaw/instance.json','utf8')).apiKey)")
          curl -fsS -X POST http://localhost:3000/api/actions \
            -H "x-api-key: $KEY" -H "content-type: application/json" \
            -d '{"agent_id":"ci-smoke","action_type":"test","declared_goal":"up-smoke verification"}'
        shell: bash

      - name: Show up.log tail on failure
        if: ${{ failure() || cancelled() }}
        # Redact the per-run admin password and single-use login URL before anything
        # leaves the runner — this is a public repo and artifacts are downloadable.
        run: |
          if [ -f up.log ]; then
            grep -viE 'admin password|login\?ott=' up.log > up.redacted.log || true
            tail -n 200 up.redacted.log
          else
            echo "up.log not found"
          fi
        shell: bash

      - name: Upload up.log on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: up-log-${{ matrix.os }}
          path: up.redacted.log
          if-no-files-found: ignore

      - name: Down
        run: node cli/bin/dashclaw.js down
        shell: bash
