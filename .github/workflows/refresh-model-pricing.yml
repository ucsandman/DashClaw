name: Refresh model pricing

# Weekly pull from LiteLLM's community-maintained pricing JSON. Runs
# `npm run pricing:refresh:apply` against the marker-bounded blocks in
# app/lib/billing.js and app/lib/claude-code/pricing.js, and opens a
# pull request when anything changed. Hand-curated rows (unversioned
# family defaults, Codex, Llama) sit outside the markers and aren't
# touched.
#
# Manual trigger: Actions tab → "Refresh model pricing" → "Run workflow".
#
# One-time setup in the repo:
#   Settings → Actions → General → Workflow permissions
#     - Allow GitHub Actions to create and approve pull requests
#     - Read and write permissions
#   (default-tokens can open PRs against the same repo with the
#   permissions block below; this just unlocks the org-level toggle.)

on:
  schedule:
    # Sundays 05:00 UTC — well after the Vercel outcome-sweep window.
    - cron: '0 5 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Capture pre-apply diff summary
        id: diff
        run: |
          set -e
          DIFF_OUTPUT=$(npm run --silent pricing:refresh 2>&1 || true)
          {
            echo "summary<<DIFF_EOF"
            echo "$DIFF_OUTPUT"
            echo "DIFF_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Apply pricing refresh
        run: npm run pricing:refresh:apply

      - name: Run tests against refreshed tables
        run: npx vitest run __tests__/unit/billing.test.js __tests__/unit/billing-cache.test.js __tests__/unit/refresh-model-pricing.test.js __tests__/unit/claude-code/pricing.test.js

      - name: Detect file changes
        id: changes
        run: |
          if git diff --quiet app/lib/billing.js app/lib/claude-code/pricing.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore(pricing): weekly refresh from LiteLLM'
          title: 'chore(pricing): weekly refresh from LiteLLM'
          body: |
            Automated weekly pull from
            [LiteLLM's `model_prices_and_context_window.json`](https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json).

            Dry-run output from `npm run pricing:refresh`:

            ```
            ${{ steps.diff.outputs.summary }}
            ```

            Review the diff in `app/lib/billing.js` and
            `app/lib/claude-code/pricing.js`, confirm the rate changes
            are real (cross-check Anthropic / OpenAI / Google pricing
            pages for anything that looks surprising), and merge.

            ---

            If you adopt these rates, consider running
            `node --import tsx scripts/backfill-code-session-cache-cost.mjs --apply`
            against prod to recompute historical `cost_usd` values that
            were stored under the old rates.

            Generated by `.github/workflows/refresh-model-pricing.yml`.
          branch: chore/pricing-refresh
          delete-branch: true
          labels: |
            pricing
            automated
