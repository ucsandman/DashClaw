name: Reset meters

# Scheduler for `/api/cron/reset-meters`. Resets monthly action / token
# counters at the top of each calendar month. Without this, the meters
# accumulate forever and the org's usage graphs read wrong.
#
# Setup (same secrets as outcome-sweep.yml — already configured if you
# enabled that one):
#   1. In repo Settings → Secrets and variables → Actions, ensure:
#        - DASHCLAW_BASE_URL  (e.g. https://my-dashclaw.vercel.app)
#        - CRON_SECRET        (matches the CRON_SECRET env on Vercel)
#   2. Enable this workflow (disabled for forks by default).
#
# Manual trigger: Actions tab → "Reset meters" → "Run workflow".

on:
  schedule:
    # Monthly at 00:00 UTC on the 1st.
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/reset-meters
        env:
          BASE_URL: ${{ secrets.DASHCLAW_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Reset meters: required secrets not configured — run skipped."
            exit 0
          fi
          status=$(curl -sS --max-time 30 --connect-timeout 10 -o /tmp/resp.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/reset-meters")
          echo "HTTP $status"
          cat /tmp/resp.json
          if [ "$status" != "200" ]; then
            exit 1
          fi
