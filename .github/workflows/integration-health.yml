name: Integration health check

# Optional scheduler for `/api/cron/integration-health`. Enable this workflow
# if you want automated 6-hour health polling without a Vercel Pro cron.
#
# Runs once PER INSTANCE — see outcome-sweep.yml for why a single url+secret
# pair is not enough (each deployment has its own CRON_SECRET on Vercel).
#
# Setup:
#   1. In repo Settings → Secrets and variables → Actions, add per instance:
#        - DASHCLAW_SELF_BASE_URL     + DASHCLAW_SELF_CRON_SECRET
#        - DASHCLAW_HOSTED_BASE_URL   + DASHCLAW_HOSTED_CRON_SECRET
#      A target whose two secrets are unset is skipped; the others still run.
#   2. Enable the workflow (it's disabled for forks by default).
#
# Manual trigger: Actions tab → "Integration health check" → "Run workflow".

on:
  schedule:
    # Every 6 hours, on the hour.
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: ping (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: self
            url_secret: DASHCLAW_SELF_BASE_URL
            key_secret: DASHCLAW_SELF_CRON_SECRET
          - target: hosted
            url_secret: DASHCLAW_HOSTED_BASE_URL
            key_secret: DASHCLAW_HOSTED_CRON_SECRET
    steps:
      - name: Hit /api/cron/integration-health
        env:
          BASE_URL: ${{ secrets[matrix.url_secret] }}
          CRON_SECRET: ${{ secrets[matrix.key_secret] }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Integration health check [${{ matrix.target }}]: ${{ matrix.url_secret }} / ${{ matrix.key_secret }} not configured — target skipped."
            exit 0
          fi
          status=$(curl -sS --max-time 30 --connect-timeout 10 -o /tmp/resp.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/integration-health")
          echo "HTTP $status"
          cat /tmp/resp.json
          if [ "$status" != "200" ]; then
            exit 1
          fi
