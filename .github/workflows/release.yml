# Publishes the SDKs and the CLI when a version tag is pushed (v5.12.0 style).
# Auth is trusted publishing (OIDC) on both registries: no NPM_TOKEN or
# PYPI_API_TOKEN secrets exist to leak. Registry-side setup (one time):
#   PyPI:  project dashclaw -> Manage -> Publishing -> add GitHub publisher
#          (ucsandman/DashClaw, workflow release.yml)
#   npm:   package dashclaw -> Settings -> Trusted Publisher
#          (ucsandman/DashClaw, workflow release.yml)
#   npm:   package @dashclaw/cli -> Settings -> Trusted Publisher
#          (ucsandman/DashClaw, workflow release.yml)
# The guard job makes version drift structurally impossible: nothing
# publishes unless the tag, sdk/package.json, and sdk-python/pyproject.toml
# all agree. The CLI versions independently (0.x); its job publishes only
# when cli/package.json is ahead of the registry.
# workflow_dispatch = the "publish now" button: every job skips anything
# already on the registry, so a manual run only publishes what is missing.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  versions-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Manual dispatch — skip tag drift check
        if: github.ref_type != 'tag'
        run: echo "workflow_dispatch run — per-package skip-if-published guards apply"
      - name: Tag matches both SDK versions
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NPM_V=$(node -p "require('./sdk/package.json').version")
          PY_V=$(grep -m1 '^version' sdk-python/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$TAG npm=$NPM_V pypi=$PY_V"
          if [ "$TAG" != "$NPM_V" ] || [ "$TAG" != "$PY_V" ]; then
            echo "::error::Version drift: tag v$TAG, sdk/package.json $NPM_V, sdk-python $PY_V. Nothing was published."
            exit 1
          fi

  publish-npm:
    needs: versions-match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Publish dashclaw to npm (skips if version already published)
        working-directory: sdk
        run: |
          PUBLISHED=$(npm view dashclaw version 2>/dev/null || echo "none")
          LOCAL=$(node -p "require('./package.json').version")
          if [ "$PUBLISHED" = "$LOCAL" ]; then
            echo "npm already at $LOCAL; skipping"
            exit 0
          fi
          npm publish --provenance --access public

  publish-cli:
    needs: versions-match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Publish @dashclaw/cli to npm (skips if version already published)
        working-directory: cli
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @dashclaw/cli@"$LOCAL" version 2>/dev/null || echo "none")
          if [ "$PUBLISHED" = "$LOCAL" ]; then
            echo "npm already has @dashclaw/cli@$LOCAL; skipping"
            exit 0
          fi
          npm publish --provenance --access public

  publish-pypi:
    needs: versions-match
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade build
          rm -rf dist
          python -m build
      - name: Publish dashclaw to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk-python/dist
          skip-existing: true
