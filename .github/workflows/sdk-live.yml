name: SDK Live Validation

on:
  workflow_dispatch:
    inputs:
      dashclaw_url:
        description: 'DashClaw instance URL (leave empty to use DASHCLAW_URL secret)'
        required: false
        default: ''
      agent_id:
        description: 'Agent ID for test records'
        required: false
        default: 'sdk-live-test-agent'

jobs:
  sdk-live-node:
    name: Node SDK Live
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Node SDK live validation
        env:
          DASHCLAW_URL: ${{ inputs.dashclaw_url || secrets.DASHCLAW_URL }}
          DASHCLAW_API_KEY: ${{ secrets.DASHCLAW_API_KEY }}
          DASHCLAW_AGENT_ID: ${{ inputs.agent_id }}
        run: node scripts/test-sdk-live.mjs

  sdk-live-python:
    name: Python SDK Live
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install cryptography (for agent signing)
        run: pip install cryptography

      - name: Run Python SDK live validation
        env:
          DASHCLAW_URL: ${{ inputs.dashclaw_url || secrets.DASHCLAW_URL }}
          DASHCLAW_API_KEY: ${{ secrets.DASHCLAW_API_KEY }}
          DASHCLAW_AGENT_ID: ${{ inputs.agent_id || 'sdk-live-test-agent-py' }}
          PYTHONPATH: sdk-python
        run: python scripts/test-sdk-live-python.py
