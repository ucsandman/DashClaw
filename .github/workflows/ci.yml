name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # manual backfill: pushes during a GitHub Actions outage create no run at all,
  # so this is the only way to run CI for a commit that missed its trigger
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Incremental Next.js (webpack) build cache — the build is the long pole;
      # without this every run compiles cold. Content-hashed, so a stale cache
      # never produces a wrong build. Shared by key with the startup-smoke job.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextcache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextcache-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      # cli/ is a separate package with its own dependencies (tar, pg,
      # embedded-postgres). The root install does not provide them, so any
      # test that SPAWNS cli/bin/dashclaw.js — as the openclaw install wiring
      # tests do — dies on ERR_MODULE_NOT_FOUND before reaching its assertion.
      # End users are unaffected: `npm i -g @dashclaw/cli` installs these.
      - name: Install CLI dependencies
        run: npm ci --no-audit --no-fund --prefer-offline --prefix cli

      - name: Install MCP server dependencies
        run: npm ci --no-audit --no-fund --prefer-offline --prefix mcp-server

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Check script syntax
        run: npm run scripts:check-syntax

      - name: Validate docs
        run: npm run docs:check

      - name: Check OpenAPI contract drift
        run: npm run openapi:check

      - name: Check API inventory maturity drift
        run: npm run api:inventory:check

      - name: Check doc count + freshness-date drift
        run: node scripts/check-doc-counts.mjs --strict

      - name: Check route-level SQL guardrail
        run: npm run route-sql:check

      - name: Check surface budget (anti-regrowth brake)
        run: npm run surface:check

      - name: Check version-string drift in user-facing code
        run: npm run version:check

      - name: Check platform + SDK version sync
        run: npm run version:sync:check

      - name: Check contract convergence
        run: npm run contracts:check

      - name: Check platform guide drift
        run: npm run guide:drift:check

      - name: Run security scanner
        run: node scripts/security-scan.js

      - name: Run tests
        run: npm run test -- --run

      - name: Run CLI tests
        run: npm test --prefix cli

      - name: Run MCP server tests
        run: npm test --prefix mcp-server

      - name: Run MCP server typecheck
        run: npm run typecheck --prefix mcp-server

      - name: Run cross-SDK integration suite
        run: npm run sdk:integration

      - name: Run cross-SDK Python contract suite
        run: npm run sdk:integration:python

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3000

  startup-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dashclaw
          POSTGRES_PASSWORD: dashclaw
          POSTGRES_DB: dashclaw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashclaw -d dashclaw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dashclaw:dashclaw@127.0.0.1:5432/dashclaw
      NEXTAUTH_SECRET: startup-smoke-nextauth-secret-1234567890
      NEXTAUTH_URL: http://127.0.0.1:3000
      DASHCLAW_API_KEY: oc_live_startup_smoke_ci_key_1234567890
      ENCRYPTION_KEY: startupsmokeencryptionkey1234567
      CRON_SECRET: startup-smoke-cron-secret
      ALLOWED_ORIGIN: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # Same incremental Next.js build cache as build-and-test (shared key), so
      # this job's build is also warm instead of compiling cold every run.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextcache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextcache-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Run auto-migrate bootstrap
        run: node scripts/auto-migrate.mjs

      - name: Build startup smoke target
        run: npm run build

      - name: Run startup smoke test
        run: npm run startup:smoke -- --timeout-ms 60000 --interval-ms 1000

      # ── Live claims proof ──────────────────────────────────────────────
      # MAINTAINER.md and README both promise that the public governance
      # claims are proven live by the policy smoke harness in CI on every
      # push. These steps ARE that promise: a real server against the real
      # Postgres service, then the two live behavioral suites — policy
      # enforcement (policy-smoke.mjs) and org isolation (cross-org-smoke.mjs).
      - name: Start server for live claims proof
        run: |
          npm run start &
          echo $! > .live-smoke-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "server never became healthy"; exit 1

      - name: Run policy smoke (live policy-enforcement proof)
        run: node scripts/policy-smoke.mjs http://127.0.0.1:3000

      - name: Run cross-org smoke (live org-isolation proof)
        run: node scripts/cross-org-smoke.mjs http://127.0.0.1:3000

      - name: Stop live claims proof server
        if: always()
        run: |
          if [ -f .live-smoke-server.pid ]; then
            kill "$(cat .live-smoke-server.pid)" 2>/dev/null || true
          fi

  hosted-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dashclaw
          POSTGRES_PASSWORD: dashclaw
          POSTGRES_DB: dashclaw_hosted_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashclaw -d dashclaw_hosted_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dashclaw:dashclaw@127.0.0.1:5432/dashclaw_hosted_integration
      INTEGRATION_DATABASE_URL: postgresql://dashclaw:dashclaw@127.0.0.1:5432/dashclaw_hosted_integration
      TEST_BASE_URL: http://127.0.0.1:3101
      PORT: 3101
      NEXTAUTH_SECRET: hosted-integration-nextauth-secret-1234567890
      NEXTAUTH_URL: http://127.0.0.1:3101
      DASHCLAW_API_KEY: oc_live_hosted_integration_admin_1234567890
      INTEGRATION_ADMIN_API_KEY: oc_live_hosted_integration_admin_1234567890
      ENCRYPTION_KEY: startupsmokeencryptionkey1234567
      CRON_SECRET: hosted-integration-cron-secret
      ALLOWED_ORIGIN: http://127.0.0.1:3101
      DASHCLAW_HOSTED: 'true'
      HOSTED_DRILL_TOKEN: hosted-integration-drill-token-1234567890
      HOSTED_PROVISION_MAX_PER_IP_PER_DAY: 20
      HOSTED_MAX_ACTIVE_TRIALS: 50

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Run hosted schema migration
        run: node scripts/auto-migrate.mjs

      - name: Build hosted integration target
        run: npm run build

      - name: Start hosted integration server
        run: |
          npm run start > hosted-integration-server.log 2>&1 &
          echo $! > .hosted-integration-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3101/api/health > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat hosted-integration-server.log
          echo "hosted integration server never became healthy"; exit 1

      - name: Run hosted happy-path integration
        run: npx vitest run __tests__/integration/hosted/end-to-end.test.js __tests__/integration/execution-claims.test.ts __tests__/integration/enforcement-liveness.test.ts __tests__/integration/schema-check-types.test.ts

      - name: Stop hosted integration server
        if: always()
        run: |
          if [ -f .hosted-integration-server.pid ]; then
            kill "$(cat .hosted-integration-server.pid)" 2>/dev/null || true
          fi
