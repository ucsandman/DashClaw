name: JTI replay-log sweep

# Scheduler for `/api/cron/jti-sweep`. Phase 2b (issue #120, design by
# @piiiico). Deletes rows from jwt_replay_log whose expires_at has passed
# so the table stays bounded under sustained traffic. The repository
# already does a probabilistic sweep on ~1% of writes; this cron handles
# low-traffic periods.
#
# Runs once PER INSTANCE — see outcome-sweep.yml for why a single url+secret
# pair is not enough (each deployment has its own CRON_SECRET on Vercel).
#
# Setup (same secrets as outcome-sweep.yml):
#   1. In repo Settings → Secrets and variables → Actions, ensure per instance:
#        - DASHCLAW_SELF_BASE_URL     + DASHCLAW_SELF_CRON_SECRET
#        - DASHCLAW_HOSTED_BASE_URL   + DASHCLAW_HOSTED_CRON_SECRET
#      A target whose two secrets are unset is skipped; the others still run.
#   2. Enable this workflow (disabled for forks by default).
#
# Manual trigger: Actions tab → "JTI replay-log sweep" → "Run workflow".

on:
  schedule:
    # Every 5 minutes. Tight cadence is cheap (a single DELETE) and keeps
    # the table from growing during traffic spikes that outpace the
    # probabilistic in-line sweep.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sweep:
    name: sweep (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: self
            url_secret: DASHCLAW_SELF_BASE_URL
            key_secret: DASHCLAW_SELF_CRON_SECRET
          - target: hosted
            url_secret: DASHCLAW_HOSTED_BASE_URL
            key_secret: DASHCLAW_HOSTED_CRON_SECRET
    steps:
      - name: Hit /api/cron/jti-sweep
        env:
          BASE_URL: ${{ secrets[matrix.url_secret] }}
          CRON_SECRET: ${{ secrets[matrix.key_secret] }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::JTI replay-log sweep [${{ matrix.target }}]: ${{ matrix.url_secret }} / ${{ matrix.key_secret }} not configured — target skipped."
            exit 0
          fi
          status=$(curl -sS --max-time 30 --connect-timeout 10 -o /tmp/resp.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/jti-sweep")
          echo "HTTP $status"
          cat /tmp/resp.json
          if [ "$status" != "200" ]; then
            exit 1
          fi
