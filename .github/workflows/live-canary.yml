name: Live host canary

# v3.4 (docs/superpowers/plans/2026-07-04-live-host-canary.md): probe the
# production hosts as a real client every hour. The probes are unauthenticated
# and need no secrets; killing a live surface fails this job within one
# interval. The verdict is ALSO filed to the operator instance when reporting
# secrets are set — that is what renders on /setup#live-canary and raises the
# posture auditability finding (the human surfaces; this job log is not one).
#
# Setup (reporting, optional but recommended):
#   Settings → Secrets and variables → Actions:
#     - LIVE_CANARY_REPORT_URL  (e.g. https://my-dashclaw.vercel.app)
#     - LIVE_CANARY_REPORT_KEY  (an operator API key on that instance)
#   Dedicated names on purpose: DASHCLAW_BASE_URL is shared with the
#   hosted-cleanup cron and must keep pointing at the hosted instance —
#   the canary REPORTS to the operator's instance, which differs.
#   If the reporting key's org is not org_default, set
#   DASHCLAW_CANARY_ORG_ID on the instance so /setup renders its runs.
#
# Manual trigger: Actions tab → "Live host canary" → "Run workflow".

on:
  schedule:
    # Hourly, off the top of the hour (GH queues spike at :00).
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Probe production hosts
        env:
          DASHCLAW_BASE_URL: ${{ secrets.LIVE_CANARY_REPORT_URL }}
          DASHCLAW_API_KEY: ${{ secrets.LIVE_CANARY_REPORT_KEY }}
        run: node scripts/live-canary.mjs
