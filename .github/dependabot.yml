version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    # Reduce PR spam: group patch/minor updates into a single weekly PR.
    groups:
      npm-weekly:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    # Major updates are often breaking (React, Tailwind, Next, etc.).
    # Ignore the biggest breaking upgrades; handle them intentionally as planned work.
    ignore:
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint-config-next"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "next"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "redis"
        update-types:
          - "version-update:semver-major"
      # @types/node must track the MINIMUM supported runtime (engines: Node
      # 20+, CI runs 20/24) — a major typings bump past that lets code
      # type-check against Node APIs the supported runtimes don't have.
      # Bump it intentionally when the supported Node floor moves.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # jsdom 30 requires Node ^22.22.2+ (engines) — incompatible with the
      # Node 20 floor for the same reason as @types/node above. Bump it
      # intentionally when the supported Node floor moves.
      - dependency-name: "jsdom"
        update-types:
          - "version-update:semver-major"
      # TypeScript 7 (the native compiler) is unsupported by typescript-eslint
      # (lint hard-errors: "typescript-eslint does not support TS 7.0").
      # Adopt it intentionally when the lint toolchain supports it.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      github-actions-weekly:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/sdk-python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    groups:
      pip-weekly:
        patterns:
          - "*"
