[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dashclaw"
version = "5.35.1"
description = "Govern Python agent callbacks with policy checks, remote approvals, execution claims, and outcome reporting."
readme = "README.md"
license = { text = "MIT" }
keywords = ["dashclaw", "ai-agent", "ai-governance", "agent-governance", "claude-code", "guardrails"]
requires-python = ">=3.7"
authors = [
    { name = "Wes Sander" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ucsandman/DashClaw"
Documentation = "https://dashclaw.io/docs"
Repository = "https://github.com/ucsandman/DashClaw"

[tool.setuptools.packages.find]
include = ["dashclaw*"]
